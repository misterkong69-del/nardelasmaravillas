<!-- Script actualizado para leer múltiples estampiyas gratis desde Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnLtvnb5IW1X-HbuC3uC0Dcf6BaojmndE",
            authDomain: "mardelasmaravillas1.firebaseapp.com",
            projectId: "mardelasmaravillas1",
            storageBucket: "mardelasmaravillas1.firebasestorage.app",
            messagingSenderId: "1041475872464",
            appId: "1:1041475872464:web:87d00298ea219bdb4aa0d5",
            measurementId: "G-F87RCG37BW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarEstampiyasGratis() {
            try {
                const querySnapshot = await getDocs(collection(db, "estampiyas_mdw"));
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Si hay imagen en Firestore (apuntando a GitHub), la cargamos
                    if(data.imagen_url) {
                        document.getElementById('imagen-base').src = data.imagen_url;
                    }
                    if(data.hash_base) {
                        document.getElementById('hash-display').innerText = data.hash_base;
                    }
                });
            } catch (error) {
                console.log("Modo local activo.");
            }
        }

        window.onload = cargarEstampiyasGratis;
    </script>
