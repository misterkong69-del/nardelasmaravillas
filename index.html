<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posta 1001 — Vidriera Clandestina Mardelwood (MDW)</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b131a;
            color: #d8f8ff;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #00ffff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        header .tag {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,255,255,0.5);
        }
        header h1 {
            font-family: 'Special Elite', cursive;
            font-size: 1.8rem;
            margin: 8px 0 0 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }
        .vidriera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-estampiya {
            background-color: #111d28;
            border: 3px solid #008b8b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .estampiya-frame {
            background: #0b131a;
            padding: 8px;
            border: 2px solid #00ffff;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .estampiya-frame img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
        }
        .info-estampa {
            font-size: 0.8rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #a5f3fc;
        }
        .info-estampa h3 {
            font-family: 'Special Elite', cursive;
            font-size: 1rem;
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .btn-descarga-mdw {
            background-color: #00ffff;
            color: #070c10;
            border: none;
            padding: 10px;
            font-family: 'Special Elite', cursive;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
            transition: all 0.3s ease;
        }
        .btn-descarga-mdw:hover {
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,255,255,0.8);
        }
    </style>
</head>
<body>

    <header>
        <div class="tag">POSTA DEL MILISEGUNDO — MDW 1001</div>
        <h1>VIDRIERA DE ESTAMPIYA! DE TIEMPO</h1>
        <p style="font-size: 0.85rem; color: #67e8f9; margin-top: 5px;">Explorá el archivo visual y descargá cada pieza con certificación atómica en vivo.</p>
    </header>

    <main id="vidriera-container" class="vidriera-grid">
        <div style="grid-column: 1 / -1; text-align: center; color: #00ffff; padding: 40px;">
            Sintonizando archivo clandestino con la nube...
        </div>
    </main>

    <canvas id="canvas-sello" style="display:none;"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnLtvnb5IW1X-HbuC3uC0Dcf6BaojmndE",
            authDomain: "mardelasmaravillas1.firebaseapp.com",
            projectId: "mardelasmaravillas1",
            storageBucket: "mardelasmaravillas1.firebasestorage.app",
            messagingSenderId: "1041475872464",
            appId: "1:1041475872464:web:87d00298ea219bdb4aa0d5",
            measurementId: "G-F87RCG37BW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lista de respaldo fija para asegurar que banda1 y las demás aparezcan siempre
        const piezasRespaldo = [
            { titulo: "aldea1", imagen_url: "aldea1.png", id_posta: "1001", hash_base: "MDW-ALDEA1" },
            { titulo: "estacion", imagen_url: "estacion.png", id_posta: "1001", hash_base: "MDW-ESTACION" },
            { titulo: "querandi", imagen_url: "querandi.png", id_posta: "1001", hash_base: "MDW-QUERANDI" },
            { titulo: "banda1", imagen_url: "banda1.png", id_posta: "1001", hash_base: "MDW-BANDA1" }
        ];

        async function cargarVidrieraCompleta() {
            const contenedor = document.getElementById('vidriera-container');
            let listaPiezas = [];

            try {
                const querySnapshot = await getDocs(collection(db, "estampiyas_mdw"));
                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        listaPiezas.push(docSnap.data());
                    });
                }
            } catch (error) {
                console.warn("Aviso: No se pudo conectar a Firestore, usando respaldo local.", error);
            }

            // Si Firestore devolvió menos de 4 o falló, completamos con el respaldo estático
            if (listaPiezas.length < 4) {
                listaPiezas = piezasRespaldo;
            }

            contenedor.innerHTML = "";

            listaPiezas.forEach((data) => {
                const imagenSrc = data.imagen_url || data.stamp_url || '';
                
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-estampiya';
                
                tarjeta.innerHTML = `
                    <div>
                        <div class="estampiya-frame">
                            <img src="${imagenSrc}" alt="${data.titulo || 'Estampa'}" crossorigin="anonymous" class="img-estampa-ref">
                        </div>
                        <div class="info-estampa">
                            <h3>${data.titulo || 'EstampiYA! de Tiempo'}</h3>
                            <div><strong>Posta:</strong> ${data.id_posta || '1001'} (MDW)</div>
                            <div><strong>Hash Base:</strong> ${data.hash_base || 'MDW-GENERICO'}</div>
                        </div>
                    </div>
                    <button class="btn-descarga-mdw" onclick="descargarEstampiyaDeVidriera(this)">
                        📥 VER Y DESCARGAR CON MS
                    </button>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        window.onload = cargarVidrieraCompleta;
    </script>

    <script>
        function descargarEstampiyaDeVidriera(btn) {
            const tarjeta = btn.closest('.tarjeta-estampiya');
            const img = tarjeta.querySelector('.img-estampa-ref');
            const canvas = document.getElementById('canvas-sello');
            const ctx = canvas.getContext('2d');

            canvas.width = img.naturalWidth || 1200;
            canvas.height = img.naturalHeight || 800;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const ahora = new Date();
            const fStr = ahora.toLocaleDateString('es-AR');
            const hStr = String(ahora.getHours()).padStart(2, '0');
            const mStr = String(ahora.getMinutes()).padStart(2, '0');
            const sStr = String(ahora.getSeconds()).padStart(2, '0');
            const msStr = String(ahora.getMilliseconds()).padStart(3, '0');
            const timestampCompleto = `${fStr} ${hStr}:${mStr}:${sStr}.${msStr}`;
            const hashAleatorio = "MDW-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-1001";

            ctx.fillStyle = "#00ffff"; 
            ctx.font = "bold 32px 'Courier New', monospace";
            
            ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
            ctx.shadowOffsetX = 6;
            ctx.shadowOffsetY = 6;
            ctx.shadowBlur = 12;

            const posX = canvas.width - 780;
            const posY = canvas.height - 240;

            ctx.fillText(`FECHA: ${timestampCompleto}`, posX, posY);
            ctx.fillText(`HASH-Q: ${hashAleatorio}`, posX, posY + 52);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px 'Courier New', monospace";
            ctx.fillText("ESTAMPIYA! DE TIEMPO — POSTA 1001", posX, posY + 110);

            const enlace = document.createElement('a');
            enlace.download = `ESTAMPIYA_TIEMPO_1001_${ahora.getTime()}.jpg`;
            enlace.href = canvas.toDataURL('image/jpeg', 0.98);
            enlace.click();
        }
    </script>

</body>
</html>
