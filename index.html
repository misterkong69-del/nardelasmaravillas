<head>

    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>

            padding: 20px;

            margin-bottom: 15px;
            text-align: left;
            color: #a5f3fc;
        }
        .btn-descarga-mdw {
            background-color: #00ffff;
            color: #070c10;
            border: none;
            padding: 14px;

            cursor: pointer;

<body>

    <div class="archivo-mdw-container">
        <div class="archivo-header">
            <div class="tag">POSTA DEL MILISEGUNDO — MDW 1001</div>
            <h2>ESTAMPIYA! DE TIEMPO</h2>
        </div>

        <div class="estampiya-frame">
            <!-- Imagen enlazada dinámicamente desde el puente de Firebase/GitHub -->
            <img id="imagen-base" src="https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/estampiyas/Estanpiya_Geo_kongggg.jpg" alt="EstampiYA! de Tiempo" crossorigin="anonymous">
        </div>

        <div class="metadatos-caja">
            <div><strong>Nodo Activo:</strong> Posta 1001 (Mardelwood)</div>
            <div><strong>Sello:</strong> VentaniYA! Atómico GPS Verificado</div>
            <div><strong>Línea de Tiempo:</strong> <span id="txt-tiempo" style="color: #00ffff; font-weight: bold; text-shadow: 0 0 4px rgba(0,255,255,0.8);">Sincronizando...</span></div>
            <div><strong>Hash ID Base:</strong> <span id="hash-display">MDW-1015F9B6-34FAF</span></div>
        </div>

        <button class="btn-descarga-mdw" onclick="descargarEstampiyaConSelloNeon3D()">
            📥 DESCARGAR ESTAMPIYA CON SELLO ATÓMICO (MS)
        </button>

        <div class="archivo-footer">
            Sistema Inalterable de Archivo Histórico Clandestino
        </div>
    </div>

    <!-- Canvas oculto para procesar el diseño con efecto 3D y celeste atómico neón -->
    <canvas id="canvas-sello" style="display:none;"></canvas>

    <!-- Importación y ejecución de Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnLtvnb5IW1X-HbuC3uC0Dcf6BaojmndE",
            authDomain: "mardelasmaravillas1.firebaseapp.com",
            projectId: "mardelasmaravillas1",
            storageBucket: "mardelasmaravillas1.firebasestorage.app",
            messagingSenderId: "1041475872464",
            appId: "1:1041475872464:web:87d00298ea219bdb4aa0d5",
            measurementId: "G-F87RCG37BW"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        console.log("Firebase conectado correctamente a la Posta 1001 (MDW).");

        // Puente automático: Buscar metadatos e imagen desde Firestore
        async function cargarEstampiyaDesdeFirebase() {
            try {
                const querySnapshot = await getDocs(collection(db, "estampiyas_mdw"));
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.imagen_url) {
                        document.getElementById('imagen-base').src = data.imagen_url;
                    }
                    if(data.hash_base) {
                        document.getElementById('hash-display').innerText = data.hash_base;
                    }
                });
            } catch (error) {
                console.error("Modo offline o error al conectar con Firestore (usando valores por defecto):", error);
            }
        }

        window.onload = cargarEstampiyaDesdeFirebase;
    </script>

    <script>
        // Actualizar reloj atómico de milisegundos en pantalla
        function actualizarRelojAtomico() {
            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString('es-AR');
            const h = String(ahora.getHours()).padStart(2, '0');
            const m = String(ahora.getMinutes()).padStart(2, '0');
            const s = String(ahora.getSeconds()).padStart(2, '0');
            const ms = String(ahora.getMilliseconds()).padStart(3, '0');
            document.getElementById('txt-tiempo').innerText = `${fechaStr} ${h}:${m}:${s}.${ms}`;
        }
        setInterval(actualizarRelojAtomico, 50);

        function descargarEstampiyaConSelloNeon3D() {
            const img = document.getElementById('imagen-base');
            const canvas = document.getElementById('canvas-sello');
            const ctx = canvas.getContext('2d');

            canvas.width = img.naturalWidth || 1200;
            canvas.height = img.naturalHeight || 800;

            // Dibujar la estampa base
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Obtener datos exactos del milisegundo de descarga
            const ahora = new Date();
            const fStr = ahora.toLocaleDateString('es-AR');
            const hStr = String(ahora.getHours()).padStart(2, '0');
            const mStr = String(ahora.getMinutes()).padStart(2, '0');
            const sStr = String(ahora.getSeconds()).padStart(2, '0');
            const msStr = String(ahora.getMilliseconds()).padStart(3, '0');
            const timestampCompleto = `${fStr} ${hStr}:${mStr}:${sStr}.${msStr}`;
            const hashAleatorio = "MDW-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-1001";

            // Sello con Celeste Atómico Brillante (#00ffff) y sombra 3D profunda
            ctx.fillStyle = "#00ffff"; 
            ctx.font = "bold 32px 'Courier New', monospace";
            
            ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
            ctx.shadowOffsetX = 6;
            ctx.shadowOffsetY = 6;
            ctx.shadowBlur = 12;

            const posX = canvas.width - 780;
            const posY = canvas.height - 240;

            ctx.fillText(`FECHA: ${timestampCompleto}`, posX, posY);
            ctx.fillText(`HASH-Q: ${hashAleatorio}`, posX, posY + 52);

            // Sub-sello oficial en blanco puro destacado
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px 'Courier New', monospace";
            ctx.fillText("ESTAMPIYA! DE TIEMPO — POSTA 1001", posX, posY + 110);

            // Disparar descarga directa del JPG resultante
            const enlace = document.createElement('a');
            enlace.download = `ESTAMPIYA_TIEMPO_1001_${ahora.getTime()}.jpg`;
            enlace.href = canvas.toDataURL('image/jpeg', 0.98);
            enlace.click();
        }
    </script>

</body>
