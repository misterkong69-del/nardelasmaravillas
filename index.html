<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posta 1001 — Vidriera Clandestina Mardelwood (MDW)</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b131a;
            color: #d8f8ff;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #00ffff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        header .tag {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,255,255,0.5);
        }
        header h1 {
            font-family: 'Special Elite', cursive;
            font-size: 1.8rem;
            margin: 8px 0 0 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }
        .vidriera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-estampiya {
            background-color: #111d28;
            border: 3px solid #008b8b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .estampiya-frame {
            background: #0b131a;
            padding: 8px;
            border: 2px solid #00ffff;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .estampiya-frame img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
        }
        .info-estampa {
            font-size: 0.8rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #a5f3fc;
        }
        .info-estampa h3 {
            font-family: 'Special Elite', cursive;
            font-size: 1rem;
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .btn-descarga-mdw {
            background-color: #00ffff;
            color: #070c10;
            border: none;
            padding: 10px;
            font-family: 'Special Elite', cursive;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
            transition: all 0.3s ease;
        }
        .btn-descarga-mdw:hover {
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,255,255,0.8);
        }
    </style>
</head>
<body>

    <header>
        <div class="tag">POSTA DEL MILISEGUNDO — MDW 1001</div>
        <h1>VIDRIERA DE ESTAMPIYA! DE TIEMPO</h1>
        <p style="font-size: 0.85rem; color: #67e8f9; margin-top: 5px;">Explorá el archivo visual y descargá cada pieza con certificación atómica en vivo.</p>
    </header>

    <main id="vidriera-container" class="vidriera-grid">
        <div style="grid-column: 1 / -1; text-align: center; color: #00ffff; padding: 40px;">
            Cargando piezas de la vidriera...
        </div>
    </main>

    <canvas id="canvas-sello" style="display:none;"></canvas>

    <script>
        // Listado oficial y blindado de piezas vinculadas a los archivos locales
        const piezasVidriera = [
            { titulo: "Auto 1", archivo: "auto1.png", posta: "1005", hash: "MDW-KONC-2026" },
            { titulo: "mr.kong", archivo: "mr_kong.png", posta: "1002", hash: "MDW-2026-1003" },
            { titulo: "EstampiYA! MardelasMaravillas", archivo: "estampiya.png", posta: "1001", hash: "MDW-KONG-2026" },
            { titulo: "Chiwizorrin", archivo: "chiwizorrin.png", posta: "1002", hash: "MDW-2026-1002" },
            { titulo: "Banda 1", archivo: "banda1.png", posta: "1002", hash: "MDW-BANDA1" }
        ];

        function cargarVidrieraLocal() {
            const contenedor = document.getElementById('vidriera-container');
            contenedor.innerHTML = "";

            piezasVidriera.forEach((data) => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-estampiya';
                
                tarjeta.innerHTML = `
                    <div>
                        <div class="estampiya-frame">
                            <img src="${data.archivo}" alt="${data.titulo}" crossorigin="anonymous" class="img-estampa-ref" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=Imagen+No+Encontrada'; console.error('⚠️ No se encontró el archivo:', '${data.archivo}')">
                        </div>
                        <div class="info-estampa">
                            <h3>${data.titulo}</h3>
                            <div><strong>Posta:</strong> ${data.posta} (MDW)</div>
                            <div><strong>Hash Base:</strong> ${data.hash}</div>
                        </div>
                    </div>
                    <button class="btn-descarga-mdw" onclick="descargarEstampiyaDeVidriera(this)">
                        📥 VER Y DESCARGAR CON MS
                    </button>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        function descargarEstampiyaDeVidriera(btn) {
            const tarjeta = btn.closest('.tarjeta-estampiya');
            const img = tarjeta.querySelector('.img-estampa-ref');
            const canvas = document.getElementById('canvas-sello');
            const ctx = canvas.getContext('2d');

            canvas.width = img.naturalWidth || 1200;
            canvas.height = img.naturalHeight || 800;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const ahora = new Date();
            const fStr = ahora.toLocaleDateString('es-AR');
            const hStr = String(ahora.getHours()).padStart(2, '0');
            const mStr = String(ahora.getMinutes()).padStart(2, '0');
            const sStr = String(ahora.getSeconds()).padStart(2, '0');
            const msStr = String(ahora.getMilliseconds()).padStart(3, '0');
            const timestampCompleto = `${fStr} ${hStr}:${mStr}:${sStr}.${msStr}`;
            const hashAleatorio = "MDW-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-1001";

            ctx.fillStyle = "#00ffff"; 
            ctx.font = "bold 32px 'Courier New', monospace";
            
            ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
            ctx.shadowOffsetX = 6;
            ctx.shadowOffsetY = 6;
            ctx.shadowBlur = 12;

            const posX = canvas.width - 780;
            const posY = canvas.height - 240;

            ctx.fillText(`FECHA: ${timestampCompleto}`, posX, posY);
            ctx.fillText(`HASH-Q: ${hashAleatorio}`, posX, posY + 52);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px 'Courier New', monospace";
            ctx.fillText("ESTAMPIYA! DE TIEMPO — POSTA 1001", posX, posY + 110);

            const enlace = document.createElement('a');
            enlace.download = `ESTAMPIYA_TIEMPO_${ahora.getTime()}.jpg`;
            enlace.href = canvas.toDataURL('image/jpeg', 0.98);
            enlace.click();
        }

        window.onload = cargarVidrieraLocal;
    </script>

</body>
</html>
