    <script>
        // Actualizar reloj de milisegundos en pantalla en tiempo real
        function actualizarRelojAtomico() {
            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString('es-AR');
            const h = String(ahora.getHours()).padStart(2, '0');
            const m = String(ahora.getMinutes()).padStart(2, '0');
            const s = String(ahora.getSeconds()).padStart(2, '0');
            const ms = String(ahora.getMilliseconds()).padStart(3, '0');

        setInterval(actualizarRelojAtomico, 50);

        function descargarEstampiyaConSelloNeon3D() {
            const img = document.getElementById('imagen-base');
            const canvas = document.getElementById('canvas-sello');
            const ctx = canvas.getContext('2d');

            // Asegurar dimensiones reales de alta resolución de la estampa
            canvas.width = img.naturalWidth || 1200;
            canvas.height = img.naturalHeight || 800;

            // Dibujar la estampiya base limpia
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Obtener milisegundos exactos de la descarga
            const ahora = new Date();
            const fStr = ahora.toLocaleDateString('es-AR');
            const hStr = String(ahora.getHours()).padStart(2, '0');
            const mStr = String(ahora.getMinutes()).padStart(2, '0');
            const sStr = String(ahora.getSeconds()).padStart(2, '0');
            const msStr = String(ahora.getMilliseconds()).padStart(3, '0');
            const timestampCompleto = `${fStr} ${hStr}:${mStr}:${sStr}.${msStr}`;
            const hashAleatorio = "MDW-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-1001";

            // Configuración del estilo 3D y celeste brillante neón
            ctx.fillStyle = "#00ffff"; // Celeste vibrante
            ctx.font = "bold 30px 'Courier New', monospace";
            
            // Efecto sombra profunda 3D despegada de la gráfica
            ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            ctx.shadowBlur = 10;

            // Posicionar las líneas de texto exactamente en la zona inferior de la estampa
            const posX = canvas.width - 780;
            const posY = canvas.height - 240;

            ctx.fillText(`FECHA: ${timestampCompleto}`, posX, posY);
            ctx.fillText(`HASH-Q: ${hashAleatorio}`, posX, posY + 50);

            // Sello inferior secundario de la Posta 1001 en blanco destacado
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px 'Courier New', monospace";
            ctx.fillText("MDP. 1001 SAT — POSTA CLANDESTINA", posX, posY + 105);

            // Descargar el archivo resultante en formato JPG de altísima calidad
            const enlace = document.createElement('a');
            enlace.download = `ESTAMPIYA_POSTA1001_${ahora.getTime()}.jpg`;
            enlace.href = canvas.toDataURL('image/jpeg', 0.98);
            enlace.click();
        }
